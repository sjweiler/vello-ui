name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VUI_REQUIRE_GPU_SNAPSHOTS: "1"
      VUI_VULKAN_VALIDATION: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check -p vui-winit --no-default-features
      - run: cargo check -p vui-winit --no-default-features --features accessibility
      - run: cargo check -p vui-winit --no-default-features --features system-fonts
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --all-features
      - name: Stress windowed Vulkan swapchain
        run: timeout 90s xvfb-run --auto-servernum cargo test -p vui-ash --test windowed_swapchain
        env:
          VUI_RUN_WINDOWED_SWAPCHAIN: "1"
          VUI_VULKAN_SAMPLES: "1"
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          VK_LAYER_DEBUG_ACTION: VK_DBG_LAYER_ACTION_FAIL
          VK_LAYER_REPORT_FLAGS: error
      - run: cargo bench -p vui-ash --bench renderer --no-run
      - run: ./scripts/package.sh

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VUI_SKIP_GPU_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - run: cargo test --workspace --all-features --exclude vui-platform-linux
